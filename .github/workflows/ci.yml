name: CI

on:
  push:
    branches: [main]
  pull_request:

# No telemetry anywhere in this project, including CI: no coverage upload
# services, no test analytics, no external dashboards. Everything the workflow
# does stays inside this repository's own runners and artifacts.
env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt, clippy, nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Order is the failure-fast ladder: cheapest and most mechanical first.
      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Tests
        run: cargo nextest run --workspace
